# 홈서버 공유 PostgreSQL
# 다른 프로젝트에서도 infrastructure 네트워크를 external로 참조하여 사용 가능
# 실행: docker compose -f docker-compose.infrastructure.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: home-postgres
    restart: unless-stopped
    networks:
      - infrastructure
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  infrastructure:
    driver: bridge
    name: infrastructure

volumes:
  postgres_data:
