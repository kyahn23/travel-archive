services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: travel-archive-backend:${APP_VERSION:-local}
    container_name: travel-archive-backend
    restart: unless-stopped
    networks:
      - travel-archive
      - infrastructure
    environment:
      DB_URL: jdbc:postgresql://home-postgres:5432/travel_archive
      DB_USERNAME: travel_archive
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      COOKIE_SECURE: "true"
    volumes:
      - uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        API_ORIGIN: http://travel-archive-backend:8080
        APP_VERSION: ${APP_VERSION:-local}
    image: travel-archive-frontend:${APP_VERSION:-local}
    container_name: travel-archive-frontend
    restart: unless-stopped
    networks:
      - travel-archive
    environment:
      API_ORIGIN: http://travel-archive-backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  travel-archive:
    driver: bridge
    name: travel-archive
  infrastructure:
    external: true

volumes:
  uploads:
